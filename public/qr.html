<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Asistente Kermesse</title>
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="/lode-symbol.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="/symbol.js"></script>
  <style>
    :root {
      --black: #000; --g700: #585858; --g500: #8a8a8a; --g100: #f2f2f2; --white: #fff;
      --ease-out: cubic-bezier(.16, 1, .3, 1); --ease-in-out: cubic-bezier(.65, 0, .35, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--white); color: var(--black); font-family: Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh;
      padding: clamp(20px, 5vw, 64px) clamp(16px, 6vw, 80px);
    }
    .label { font: 600 clamp(11px, 1vw, 14px)/1 Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--g500); }
    .top, .bottom { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .mark { width: clamp(22px, 2.3vw, 34px); }
    .sym { display: block; width: 100%; height: auto; overflow: visible; }
    .sym .half { fill: var(--black); transform-box: fill-box; transform-origin: 50% 50%; }
    /* Las dos mitades del símbolo se encuentran y luego conversan en bucle */
    .mark .l { animation: meetL 1.1s var(--ease-out) both, talkL 3.2s var(--ease-in-out) 1.6s infinite; }
    .mark .r { animation: meetR 1.1s var(--ease-out) both, talkR 3.2s var(--ease-in-out) 1.6s infinite; }
    .stage { flex: 1; display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: clamp(24px, 6vw, 96px); padding: 32px 0; }
    h1 { font: 400 clamp(48px, 8vw, 128px)/.95 "Instrument Serif", serif; letter-spacing: -.02em; margin: 18px 0 22px; }
    h1 em { font-style: italic; }
    p { margin: 0; color: var(--g700); font-size: clamp(16px, 1.6vw, 24px); line-height: 1.5; max-width: 30ch; }
    .card { justify-self: center; text-align: center; }
    #qr {
      position: relative; overflow: hidden; background: var(--white); padding: clamp(14px, 1.6vw, 24px);
      border: 1px solid var(--g100); border-radius: 20px; display: inline-block;
      animation: cardIn 1.1s var(--ease-out) .5s both;
    }
    #qr svg { animation: reveal 1.4s var(--ease-in-out) .8s both; }
    /* Línea de escaneo que recorre el código cada pocos segundos */
    #qr::after {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 18%;
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.5) 88%, #8a8a8a 96%, rgba(255,255,255,0) 100%);
      transform: translateY(-110%); animation: scan 3.6s var(--ease-in-out) 2.4s infinite; pointer-events: none;
    }
    .in { animation: fadeUp .9s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 90ms + 100ms); }
    .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .06em .12em 0; margin: 0 -.06em -.12em 0; }
    .w > span { display: inline-block; animation: rise 1.1s var(--ease-out) both; animation-delay: calc(var(--i) * 110ms + 250ms); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes rise { from { transform: translateY(105%); } to { transform: none; } }
    @keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes reveal { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes scan { 0% { transform: translateY(-110%); } 55%, 100% { transform: translateY(560%); } }
    @keyframes meetL { from { transform: translateX(-70%) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes meetR { from { transform: translateX(70%) rotate(12deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes talkL { 0%, 100% { transform: none; } 12% { transform: translate(-8%, -7%) rotate(-7deg); } 24%, 50% { transform: none; } }
    @keyframes talkR { 0%, 50%, 100% { transform: none; } 62% { transform: translate(8%, -7%) rotate(7deg); } 74% { transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; }
      #qr::after { display: none; }
    }
    #qr svg { width: min(34vw, 460px); height: auto; display: block; }
    .url { margin-top: 16px; font: 500 clamp(14px, 1.3vw, 20px)/1.2 Inter, sans-serif; word-break: break-all; }
    .wordmark { font: 400 clamp(20px, 2vw, 28px)/1 "Instrument Serif", serif; color: var(--black); }
    @media (max-width: 760px) {
      .stage { grid-template-columns: 1fr; text-align: left; }
      #qr svg { width: min(78vw, 360px); }
    }
  </style>
</head>
<body>
  <div class="top">
    <span class="label in" style="--i:0">Kermesse Sergista · Universidad Sergio Arboleda</span>
    <div class="mark" id="mark" role="img" aria-label="Lode"></div>
  </div>

  <div class="stage">
    <div>
      <span class="label in" style="--i:1">Asistente de IA · Jueves 29 de octubre</span>
      <h1 aria-label="Pregúntale a la Kermesse."><span class="w"><span style="--i:0">Pregúntale</span></span> <span class="w"><span style="--i:1"><em>a la</em></span></span> <span class="w"><span style="--i:2">Kermesse.</span></span></h1>
      <p class="in" style="--i:5">Escanea el código y resuelve cualquier duda sobre la feria desde tu celular.</p>
    </div>
    <div class="card">
      <div id="qr"></div>
      <div class="url in" id="url" style="--i:9"></div>
    </div>
  </div>

  <div class="bottom">
    <span class="label in" style="--i:8">Barranquilla, Colombia</span>
    <span class="wordmark in" style="--i:9">Lode.</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    document.getElementById("mark").innerHTML = lodeSymbol();
    // Apunta a la página principal del mismo dominio (o a ?url=... si se indica).
    const target = new URLSearchParams(location.search).get("url") || location.origin + "/";
    document.getElementById("url").textContent = target.replace(/^https?:\/\//, "").replace(/\/$/, "");
    const qr = qrcode(0, "H");
    qr.addData(target);
    qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 10, margin: 0, scalable: true });
  </script>
</body>
</html>
